services:
  - type: web
    name: momentum-explosion-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m pytest -q
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: BINANCE_WS_URL
        value: wss://stream.binance.com:443
